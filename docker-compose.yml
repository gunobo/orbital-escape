services:
  backend:
    build: ./backend
    container_name: orbital-escape-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - ./data:/data
    networks:
      - orbital-escape

  web:
    build: ./frontend
    container_name: orbital-escape-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - orbital-escape

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: orbital-escape-tunnel
    restart: unless-stopped
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    environment:
      - TUNNEL_CONFIG=/etc/cloudflared/config.yml
    depends_on:
      - web
    networks:
      - orbital-escape

networks:
  orbital-escape:
    driver: bridge
