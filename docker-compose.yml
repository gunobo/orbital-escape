services:
  web:
    build: ./frontend
    container_name: orbital-escape-web
    restart: unless-stopped
    networks:
      - orbital-escape

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: orbital-escape-tunnel
    restart: unless-stopped
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    environment:
      - TUNNEL_CONFIG=/etc/cloudflared/config.yml
    depends_on:
      - web
    networks:
      - orbital-escape

networks:
  orbital-escape:
    driver: bridge
